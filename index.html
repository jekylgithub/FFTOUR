<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FF Tour</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FF Tour">
<meta name="theme-color" content="#122341">
<style>
/* The Clubhouse Board, carried over from NTRC: ivory paper, navy chrome, gold detail,
   Charter serif for anything that should feel engraved. Phone first. */
:root{
  --paper:#f7f4ec; --card:#fdfcf8; --ink:#1c2740; --navy:#122341; --navy2:#1a2f54;
  --mut:#7a7466; --faint:#a49d8d; --hair:#e2dccb; --hair2:#cfc7ae;
  --gold:#a8863c; --gold-pale:#d9c89a; --gold-wash:rgba(168,134,60,.07);
  --green:#3f6b46; --red:#a32636;
  --serif:"Charter","Bitstream Charter","Iowan Old Style",Palatino,"Palatino Linotype",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--navy);}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;line-height:1.45;min-height:100vh;overscroll-behavior-y:contain;}
button{font:inherit;}
.mutd{color:var(--mut);}

/* chrome */
.chrome{position:sticky;top:0;z-index:20;background:var(--navy);color:#f4f1e8;
  box-shadow:0 2px 10px rgba(18,35,65,.25);
  padding-top:env(safe-area-inset-top,0px);padding-left:env(safe-area-inset-left,0px);
  padding-right:env(safe-area-inset-right,0px);}
.chrome-in{max-width:960px;margin:0 auto;display:flex;align-items:center;justify-content:center;
  padding:14px 14px 4px;}
.brand{font-family:var(--serif);font-weight:700;font-size:17px;letter-spacing:.04em;}
.brand{display:flex;align-items:center;gap:10px;}
.mono-h{height:26px;width:auto;color:var(--gold-pale);flex:none;}
.mono-r{height:30px;width:auto;color:var(--gold);flex:none;}
.wxbar{max-width:960px;margin:0 auto;text-align:center;padding:2px 14px 9px;
  font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:rgba(244,241,232,.6);
  font-variant-numeric:tabular-nums;line-height:1.7;}
.wxbar b{font-weight:600;color:rgba(244,241,232,.9);}
.wxbar .bar-next{display:block;color:var(--gold-pale);font-weight:600;}
@media(max-width:420px){ .wxbar{font-size:10px;letter-spacing:.1em;} }
.sample-flag{background:var(--gold);color:var(--navy);text-align:center;font-size:10px;
  letter-spacing:.2em;text-transform:uppercase;font-weight:700;padding:5px 10px;}
.tabs-wrap{position:relative;max-width:960px;margin:0 auto;}
.tabs{display:flex;gap:2px;overflow-x:auto;padding:6px 8px 0;justify-content:safe center;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;background:none;border:none;color:rgba(244,241,232,.66);
  font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;
  padding:9px 12px 11px;cursor:pointer;border-bottom:2px solid transparent;position:relative;}
.tab.on{color:var(--gold-pale);border-bottom-color:var(--gold);}
.tab:not(:last-child)::after{content:"";position:absolute;right:-3px;top:calc(50% - 2px);
  width:3px;height:3px;border-radius:50%;background:rgba(244,241,232,.26);}
.yrs{max-width:960px;margin:0 auto;display:flex;justify-content:center;gap:7px;
  padding:9px 10px 11px;flex-wrap:wrap;border-top:1px solid rgba(217,200,154,.14);}
.yr-pill{font-size:10.5px;letter-spacing:.14em;font-weight:600;text-transform:uppercase;
  color:rgba(244,241,232,.55);background:none;border:1px solid rgba(217,200,154,.28);
  border-radius:999px;padding:5px 12px;cursor:pointer;font-variant-numeric:tabular-nums;}
.yr-pill.on{color:var(--gold-pale);border-color:var(--gold);background:rgba(217,200,154,.1);}
.wrap{max-width:960px;margin:0 auto;padding-top:clamp(22px,4vw,44px);
  padding-bottom:calc(80px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));}

/* masthead + plaque */
.mast{text-align:center;}
.kicker{font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold);margin-bottom:12px;}
.mast h1{margin:0;font-family:var(--serif);font-weight:700;color:var(--navy);
  font-size:clamp(28px,6vw,46px);line-height:1.05;text-wrap:balance;}
.mast-rule{display:flex;align-items:center;gap:14px;margin:14px auto 10px;max-width:400px;}
.mast-rule span{flex:1;height:1px;background:var(--hair2);}
.mast-rule em{font-family:var(--serif);font-style:normal;color:var(--gold);font-size:16px;letter-spacing:.22em;}
.subtitle{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);}
.plaque{margin:clamp(22px,4vw,36px) auto 0;max-width:620px;}
.plq-in{background:linear-gradient(180deg,var(--navy2),var(--navy));border-radius:6px;
  box-shadow:inset 0 0 0 1px rgba(217,200,154,.55), inset 0 0 0 5px var(--navy), inset 0 0 0 6px rgba(217,200,154,.25),
  0 12px 30px rgba(18,35,65,.18);
  padding:clamp(18px,4vw,30px) clamp(16px,4vw,36px);text-align:center;color:#f4f1e8;}
.plq-label{font-size:10px;letter-spacing:.4em;text-transform:uppercase;color:var(--gold-pale);margin-bottom:10px;}
.plq-name{font-family:var(--serif);font-weight:700;font-size:clamp(26px,7vw,44px);line-height:1.1;}
.plq-score{font-family:var(--serif);font-size:clamp(14px,3.4vw,18px);color:var(--gold-pale);margin-top:6px;
  font-variant-numeric:tabular-nums lining-nums;}
.plq-verdict{margin-top:12px;font-size:clamp(10.5px,2.2vw,13px);letter-spacing:.24em;text-transform:uppercase;color:var(--gold-pale);}
.plq-sub{margin-top:8px;font-family:var(--serif);font-style:italic;font-size:13.5px;color:rgba(244,241,232,.72);}

/* sections */
.sec{margin-top:clamp(30px,5vw,48px);}
.sec-t{margin:0;font-family:var(--serif);font-weight:700;color:var(--navy);text-align:center;
  font-size:clamp(22px,4.2vw,30px);}
.sec-s{text-align:center;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut);
  margin:7px 0 20px;}
.quip{max-width:560px;margin:14px auto 0;text-align:center;font-family:var(--serif);font-style:italic;
  font-size:14.5px;line-height:1.55;color:var(--ink);}
.quip::before{content:"\201C";color:var(--gold);} .quip::after{content:"\201D";color:var(--gold);}
.note{max-width:620px;margin:12px auto 0;text-align:center;font-size:12px;color:var(--mut);line-height:1.6;}
.empty{color:var(--faint);text-align:center;padding:30px 10px;font-family:var(--serif);font-style:italic;font-size:15px;}

/* leaderboard */
.lb{border-top:2px solid var(--navy);border-bottom:1px solid var(--hair2);max-width:720px;margin:0 auto;}
.row{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;
  padding:12px 6px;border-top:1px solid var(--hair);cursor:pointer;}
.row:first-child{border-top:0;}
.row.champ{background:var(--gold-wash);}
.c-pos{font-family:var(--serif);color:var(--mut);font-size:15px;text-align:center;}
.row.champ .c-pos{color:var(--gold);font-weight:700;}
.c-name{font-family:var(--serif);font-weight:700;font-size:16px;color:var(--navy);min-width:0;}
.c-meta{display:block;font-family:var(--sans);font-weight:400;font-size:11px;color:var(--mut);
  letter-spacing:.03em;margin-top:2px;font-variant-numeric:tabular-nums;}
.c-tot{font-family:var(--serif);font-weight:700;font-size:22px;color:var(--navy);
  font-variant-numeric:tabular-nums lining-nums;text-align:right;}
.c-tot small{display:block;font-family:var(--sans);font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--faint);font-weight:600;}
.rtag{display:inline-block;font-family:var(--sans);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;
  font-weight:700;padding:2px 6px;border-radius:3px;margin-left:6px;vertical-align:2px;}
.rtag-gold{color:var(--gold);border:1px solid var(--gold-pale);background:#fff;}
.rtag-mute{color:var(--mut);border:1px solid var(--hair2);background:#fff;}

/* tables */
.tblw{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%;margin:0 auto;}
table.t{border-collapse:collapse;margin:0 auto;font-variant-numeric:tabular-nums lining-nums;min-width:100%;}
table.t th{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:600;
  padding:8px 8px;border-bottom:2px solid var(--navy);text-align:center;white-space:nowrap;}
table.t th:first-child,table.t td:first-child{text-align:left;}
table.t td{padding:9px 8px;border-bottom:1px solid var(--hair);text-align:center;font-size:13.5px;white-space:nowrap;}
table.t td.nm{font-family:var(--serif);font-weight:700;color:var(--navy);}
table.t td.best{color:var(--gold);font-weight:700;}
table.t tr.tot td{border-top:2px solid var(--hair2);font-weight:700;}
.rd-h{font-size:10px;color:var(--faint);letter-spacing:.06em;text-transform:none;display:block;font-weight:400;}

/* cards */
.grid2{display:grid;grid-template-columns:1fr;gap:12px;max-width:820px;margin:0 auto;}
@media(min-width:700px){.grid2{grid-template-columns:1fr 1fr;}}
.card{background:var(--card);border:1px solid var(--hair);border-radius:4px;padding:14px 16px;}
.card-h{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.card-b{font-family:var(--serif);font-size:18px;font-weight:700;color:var(--navy);line-height:1.25;}
.card-s{font-size:12px;color:var(--mut);margin-top:4px;line-height:1.5;}
.card-q{font-family:var(--serif);font-style:italic;font-size:13px;color:var(--ink);margin-top:8px;line-height:1.5;}

/* stat strip */
.quart{display:grid;grid-template-columns:repeat(4,1fr);max-width:720px;margin:18px auto 0;
  border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);}
.q{padding:14px 4px;text-align:center;border-left:1px solid var(--hair);}
.q:first-child{border-left:0;}
.q b{display:block;font-family:var(--serif);font-size:24px;color:var(--navy);font-variant-numeric:tabular-nums lining-nums;}
.q span{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:600;}
@media(max-width:520px){ .quart{grid-template-columns:repeat(2,1fr);} .q:nth-child(3){border-left:0;}
  .q:nth-child(n+3){border-top:1px solid var(--hair);} }

/* player picker on the bio */
.pp{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin:0 auto 22px;}
.pp button{background:var(--card);border:1px solid var(--hair2);border-radius:999px;padding:8px 14px;cursor:pointer;
  font-family:var(--serif);font-size:13.5px;font-weight:600;color:var(--navy);}
.pp button.on{background:var(--navy);color:var(--gold-pale);border-color:var(--navy);}

/* h2h grid */
.h2h td.w{color:var(--green);font-weight:700;} .h2h td.l{color:var(--mut);} .h2h td.x{color:var(--hair2);}

/* forms (keeper) */
.form{max-width:640px;margin:0 auto;}
.fld{display:block;margin:0 0 12px;}
.fld span{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);font-weight:600;margin-bottom:4px;}
.fld input,.fld select,.fld textarea{width:100%;font-size:16px;padding:10px;border:1px solid var(--hair2);border-radius:4px;
  background:#fff;color:var(--ink);font-family:var(--sans);}
.fld2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.rnd{background:var(--card);border:1px solid var(--hair);border-radius:4px;padding:12px 14px;margin-bottom:12px;}
.rnd-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
.rnd-t{font-family:var(--serif);font-weight:700;color:var(--navy);font-size:15px;}
.ptsg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
@media(min-width:600px){.ptsg{grid-template-columns:repeat(4,1fr);}}
.ptsg input{text-align:center;font-size:20px;font-family:var(--serif);font-weight:700;}
.btn-primary{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;
  background:var(--navy);color:#f4f1e8;border:none;border-radius:4px;padding:13px 22px;cursor:pointer;}
.btn-quiet{font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  background:none;border:1px solid var(--hair2);color:var(--mut);border-radius:4px;padding:11px 14px;cursor:pointer;}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:14px;}
.pubbar{max-width:640px;margin:22px auto 0;border:1px solid var(--hair2);border-radius:4px;padding:12px 14px;
  background:var(--card);text-align:center;}
.pubbar.dirty{border-color:var(--gold);background:var(--gold-wash);}
.pubbar-t{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--mut);margin-bottom:8px;}
.pubbar.dirty .pubbar-t{color:var(--gold);}
#pubStatus{font-size:12px;color:var(--mut);margin-top:8px;}

.foot{text-align:center;margin-top:44px;font-size:9px;letter-spacing:.12em;color:var(--hair2);line-height:1.6;}

#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);z-index:58;
  background:var(--navy);color:#fdfcf8;font-size:11.5px;
  letter-spacing:.14em;text-transform:uppercase;padding:10px 18px;border-radius:999px;
  opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;box-shadow:0 4px 16px rgba(28,39,64,.22);}
#toast.show{opacity:1;transform:translate(-50%,0);}

/* the landing page */
#splash{position:fixed;inset:0;z-index:60;background:var(--paper);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:clamp(28px,7vw,64px);overflow-y:auto;
  opacity:1;transition:opacity .8s ease, visibility .8s;}
#splash.arriving{opacity:0;transition:none;}
#splash.gone{opacity:0;visibility:hidden;pointer-events:none;}
#splash > *{opacity:0;transform:translateY(7px);animation:spIn .95s cubic-bezier(.22,.61,.36,1) forwards;}
@keyframes spIn{to{opacity:1;transform:none;}}
.sp-k{font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:var(--mut);animation-delay:.15s;}
.sp-mono{width:min(190px,48vw);height:auto;color:var(--navy);margin-top:14px;animation-delay:.2s;}
.sp-t{font-family:var(--serif);font-weight:700;color:var(--navy);line-height:1.05;
  font-size:clamp(38px,9vw,72px);margin-top:16px;animation-delay:.3s;}
.sp-r{display:flex;align-items:center;gap:16px;margin-top:20px;width:min(340px,72vw);animation-delay:.45s;}
.sp-r span{flex:1;height:1px;background:var(--hair2);}
.sp-r em{font-family:var(--serif);font-style:normal;color:var(--gold);font-size:clamp(15px,3.4vw,20px);letter-spacing:.16em;}
.sp-v{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--mut);margin-top:18px;animation-delay:.6s;}
.sp-tag{font-family:var(--serif);font-style:italic;color:var(--faint);font-size:13px;margin-top:10px;animation-delay:.65s;}
.sp-champ{margin-top:24px;width:min(300px,80vw);background:linear-gradient(180deg,var(--navy2),var(--navy));border-radius:5px;
  box-shadow:inset 0 0 0 1px rgba(217,200,154,.5), inset 0 0 0 4px var(--navy), inset 0 0 0 5px rgba(217,200,154,.2), 0 8px 20px rgba(18,35,65,.14);
  padding:12px 10px;color:#f4f1e8;animation-delay:.72s;}
.sp-champ i{display:block;font-style:normal;font-size:8.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold-pale);}
.sp-champ b{display:block;font-family:var(--serif);font-size:17px;margin-top:4px;}
.sp-me{margin-top:20px;max-width:34ch;animation-delay:.8s;}
.sp-hi{font-family:var(--serif);font-weight:700;color:var(--navy);font-size:18px;}
.sp-qu{font-family:var(--serif);font-style:italic;color:var(--ink);font-size:13.5px;line-height:1.5;margin-top:5px;}
.sp-e{margin-top:20px;font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--faint);animation-delay:1s;}
.sp-e i{display:inline-block;font-style:normal;animation:spPulse 2.6s ease-in-out infinite;}
@keyframes spPulse{0%,100%{opacity:.45}50%{opacity:1}}
.sp-who-h{font-family:var(--serif);font-weight:700;color:var(--navy);font-size:20px;margin-top:26px;animation-delay:.72s;}
.sp-who-w{width:min(360px,100%);margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px;animation-delay:.85s;}
.sp-who-p{background:var(--card);border:1px solid var(--hair2);border-radius:4px;padding:12px 6px;cursor:pointer;
  font-family:var(--serif);font-size:14px;font-weight:600;color:var(--navy);}
.sp-who-l{background:none;border:0;cursor:pointer;margin-top:14px;padding:6px 10px;font-size:10.5px;
  letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:600;animation-delay:.95s;}
.sp-not{background:none;border:0;cursor:pointer;margin-top:6px;padding:6px 10px;font-size:9.5px;
  letter-spacing:.2em;text-transform:uppercase;color:var(--faint);animation-delay:1.02s;text-decoration:underline;text-underline-offset:3px;}
.sp-c{margin-top:28px;font-size:9px;letter-spacing:.14em;color:var(--hair2);line-height:1.6;animation-delay:1.2s;}
@media(prefers-reduced-motion:reduce){ #splash > *{animation:none;opacity:1;transform:none;} .sp-e i{animation:none;} }

</style>
</head>
<body>

/* ---------- the data ----------
   Published tours win over the baked-in files for the same id, so history imported
   later still turns up after the first publish, and a tour typed on tour is never
   lost to an old file. */
function merge(base, pub){
  const d = clone(base);
  if (!pub) return d;
  const by = a => { const m={}; (a||[]).forEach(x=>{ if(x&&x.id) m[x.id]=x; }); return m; };
  const p = by(d.players); (pub.players||[]).forEach(x=>{ if(x&&x.id) p[x.id]=x; }); d.players=Object.values(p);
  const t = by(d.tours);   (pub.tours||[]).forEach(x=>{ if(x&&x.id) t[x.id]=x; });
  const gone = new Set(pub.deleted||[]);
  d.tours = Object.values(t).filter(x=>!gone.has(x.id));
  d.deleted = Array.from(gone);
  if (pub.next) d.next = pub.next;
  d.publishedAt = pub.publishedAt || null;
  return d;
}
function validPub(j){ return j && typeof j==="object" && Array.isArray(j.tours) && Array.isArray(j.players); }
function bestPub(){
  if (!HOSTED) return null;
  let saved=null; try{ saved=JSON.parse(lsGet(K.saved)||"null"); }catch(e){}
  if (!validPub(saved)) saved=null;
  if (saved && (!BUILT_IN_PUB || String(saved.publishedAt||"")>=String(BUILT_IN_PUB.publishedAt||""))) return saved;
  return validPub(BUILT_IN_PUB) ? BUILT_IN_PUB : null;
}
let PUB = bestPub();
let DOC;
function rebuild(){
  let ov=null;
  if (!READONLY){ try{ ov=JSON.parse(lsGet(K.ov)||"null"); }catch(e){} }
  DOC = (ov && Array.isArray(ov.tours)) ? ov : merge(BASE_DOC, PUB);
  if (!DOC.next) DOC.next = clone(CFG.next||{});
  DOC.tours.sort((a,b)=>String(a.start||"").localeCompare(String(b.start||"")) || a.id.localeCompare(b.id));
}
rebuild();
/* Every Keeper change goes through here, and is stamped, so reopening the Keeper can
   never decide the published copy is newer and throw the change away (the NTRC v38 lesson). */
function persist(){
  lsSet(K.ov, JSON.stringify(DOC));
  lsSet(K.edit, new Date().toISOString());
}
const SAMPLE = DOC.tours.length>0 && DOC.tours.every(t=>t.sample);

/* ---------- players + tours ---------- */
const P = id => DOC.players.find(p=>p.id===id) || {id, name:id, nick:""};
const nm = id => { const p=P(id); return p.nick || p.name; };
const fullName = id => { const p=P(id); return p.nick && p.nick!==p.name ? p.name+" “"+p.nick+"”" : p.name; };
const core = () => DOC.players.filter(p=>!p.guest);
const isNum = v => typeof v==="number" && isFinite(v);
function tourIds(t){
  const s=new Set(t.players||[]);
  (t.rounds||[]).forEach(r=>Object.keys(r.pts||{}).forEach(k=>{ if(isNum(r.pts[k])) s.add(k); }));
  const order=DOC.players.map(p=>p.id);
  return Array.from(s).sort((a,b)=>order.indexOf(a)-order.indexOf(b));
}
const scored = r => Object.values(r.pts||{}).filter(isNum).length;
const played = t => (t.rounds||[]).some(r=>scored(r)>=2);
function tourDone(t){
  if (!played(t)) return false;
  if (t.status==="done") return true;
  if (t.status==="live") return false;
  const end = String(t.end||t.start||"");
  const today = new Date().toISOString().slice(0,10);
  return (t.rounds||[]).every(r=>scored(r)>=2) && (end.length<10 || end<today);
}
const tourYear = t => String(t.start||"").slice(0,4);
const tourLabel = t => t.name || ((t.venue||"Tour")+" "+tourYear(t));
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmtDate(s){
  s=String(s||""); if(!s) return "";
  if (s.length===4) return s;
  if (s.length===7) return MONTHS[+s.slice(5,7)-1]+" "+s.slice(0,4);
  return (+s.slice(8,10))+" "+MONTHS[+s.slice(5,7)-1]+" "+s.slice(0,4);
}
function fmtRange(a,b){
  a=String(a||""); b=String(b||"");
  if (!a) return "Dates TBC";
  if (!b || a===b || a.length<10 || b.length<10) return fmtDate(a);
  if (a.slice(0,7)===b.slice(0,7)) return (+a.slice(8,10))+"–"+fmtDate(b);
  if (a.slice(0,4)===b.slice(0,4)) return (+a.slice(8,10))+" "+MONTHS[+a.slice(5,7)-1]+" – "+fmtDate(b);
  return fmtDate(a)+" – "+fmtDate(b);
}
const daysTo = s => { if(!s||String(s).length<10) return null; return Math.ceil((new Date(s+"T00:00:00")-Date.now())/86400000); };

/* ---------- scoring ---------- */
function standing(t){
  const ids=tourIds(t), rs=t.rounds||[];
  const rows=ids.map(id=>{
    const sc=rs.map(r=>isNum((r.pts||{})[id])?r.pts[id]:null);
    const got=sc.filter(isNum);
    return {id, sc, total:got.reduce((a,b)=>a+b,0), n:got.length,
      avg:got.length?got.reduce((a,b)=>a+b,0)/got.length:0, best:got.length?Math.max(...got):0,
      last:[...sc].reverse().find(isNum)||0};
  });
  rows.sort((a,b)=>b.total-a.total || b.last-a.last || b.best-a.best);
  return rows;
}
/* Winner: what the tour recorded if it says, otherwise most points, tie broken on the
   last round and then the best round. */
function winners(t){
  if (!tourDone(t)) return [];
  if (Array.isArray(t.winner) && t.winner.length) return t.winner;
  const s=standing(t); return s.length?[s[0].id]:[];
}
function spoon(t){
  if (!tourDone(t)) return null;
  const s=standing(t).filter(r=>r.n===(t.rounds||[]).length || r.n>0);
  if (s.length<3) return null;
  const full=s.filter(r=>r.n===Math.max(...s.map(x=>x.n)));
  return (full.length?full:s).slice(-1)[0].id;
}
function roundTop(r){
  const v=Object.entries(r.pts||{}).filter(([,x])=>isNum(x));
  if (v.length<2) return [];
  const m=Math.max(...v.map(([,x])=>x)); return v.filter(([,x])=>x===m).map(([k])=>k);
}
/* finishing place: joint winners both show 1st= */
function placeOf(t, s, i){
  const W=winners(t);
  if (W.length>1 && W.includes(s[i].id)) return {n:1, eq:true};
  return {n:i+1, eq:false};
}
const placeTxt = (pl, ord) => (ord?ordinal(pl.n):pl.n)+(pl.eq?"=":"");
const done = () => DOC.tours.filter(tourDone);
const lastDone = () => done().slice(-1)[0] || null;
function upcoming(){
  const n=DOC.next||{};
  if (n.start || n.venue || n.name) return {name:n.name||"", venue:n.venue||"", start:n.start||"", end:n.end||"", fromNext:true};
  const t=DOC.tours.find(x=>!tourDone(x) && String(x.end||x.start||"")>=new Date().toISOString().slice(0,10));
  return t ? {name:tourLabel(t), venue:t.venue, start:t.start, end:t.end, id:t.id} : null;

/* ---------- careers ---------- */
let _car=null;
function careers(){
  if (_car) return _car;
  const C={};
  const get=id=>C[id]||(C[id]={id,tours:0,wins:0,shared:0,second:0,spoons:0,rounds:0,pts:0,best:null,worst:null,
    rwins:0,pw:0,pl:0,ph:0,ld:0,np:0,money:0,moneyTours:0,haz:0,hazR:0,form:[],ranks:[],winList:[]});
  for (const t of DOC.tours){
    if (!played(t)) continue;
    const s=standing(t), W=winners(t), sp=spoon(t), fin=tourDone(t);
    s.forEach((r,i)=>{
      const c=get(r.id); c.tours++;
      if (fin){
        if (W.includes(r.id)){ c.wins++; if(W.length>1) c.shared++; c.winList.push(t.id); }
        else if (i===W.length || (W.length===0 && i===1)) c.second++;
        if (sp===r.id) c.spoons++;
        c.ranks.push({t:t.id, pos:placeOf(t,s,i), of:s.length});
      }
    });
    (t.rounds||[]).forEach((r,ri)=>{
      const top=roundTop(r);
      Object.entries(r.pts||{}).forEach(([id,v])=>{
        if(!isNum(v)) return;
        const c=get(id); c.rounds++; c.pts+=v; c.form.push(v);
        const rec={v, t:t.id, course:r.course||("Round "+(ri+1))};
        if(!c.best||v>c.best.v) c.best=rec;
        if(!c.worst||v<c.worst.v) c.worst=rec;
        if(top.includes(id)) c.rwins++;
      });
      const pr=r.pairs;
      if (pr && pr.a && pr.b && pr.res){
        pr.a.forEach(id=>{ const c=get(id); pr.res==="a"?c.pw++:pr.res==="b"?c.pl++:c.ph++; });
        pr.b.forEach(id=>{ const c=get(id); pr.res==="b"?c.pw++:pr.res==="a"?c.pl++:c.ph++; });
      }
      (r.ld||[]).forEach(id=>get(id).ld++);
      (r.np||[]).forEach(id=>get(id).np++);
      Object.entries(r.hazards||{}).forEach(([id,v])=>{ if(isNum(v)){ const c=get(id); c.haz+=v; c.hazR++; } });
    });
    Object.entries(t.money||{}).forEach(([id,v])=>{ if(isNum(v)){ const c=get(id); c.money+=v; c.moneyTours++; } });
  }
  Object.values(C).forEach(c=>{ c.avg=c.rounds?c.pts/c.rounds:0; c.recent=c.form.slice(-6); c.recentAvg=c.recent.length?c.recent.reduce((a,b)=>a+b,0)/c.recent.length:0; });
  return (_car=C);
}
const car = id => careers()[id] || null;
function h2h(a,b){
  let w=0,l=0,h=0,with_={w:0,l:0,h:0},vs={w:0,l:0,h:0};
  for (const t of DOC.tours) for (const r of (t.rounds||[])){
    const x=(r.pts||{})[a], y=(r.pts||{})[b];
    if (isNum(x)&&isNum(y)){ if(x>y) w++; else if(x<y) l++; else h++; }
    const pr=r.pairs; if(!pr||!pr.res||!pr.a||!pr.b) continue;
    const side=id=>pr.a.includes(id)?"a":pr.b.includes(id)?"b":null;
    const sa=side(a), sb=side(b); if(!sa||!sb) continue;
    const box=sa===sb?with_:vs;
    if (pr.res==="h") box.h++; else if (pr.res===sa) box.w++; else box.l++;
  }
  return {w,l,h,with:with_,vs};
}
const f1 = x => (Math.round(x*10)/10).toFixed(1);
const money = (v,cur) => (v<0?"−":v>0?"+":"")+(cur||"£")+Math.abs(v);

/* ---------- the roasts ----------
   Every line is computed from the record, so it is only ever true. One is picked per
   player per day, walking a shuffled list, so the same line doesn't come back
   tomorrow. */
function hash(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
const dayNo = () => Math.floor((Date.now()-new Date().getTimezoneOffset()*60000)/86400000);
function pick(list, seed){
  if (!list.length) return "";
  const order=list.map((x,i)=>[hash(seed+"|"+i),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
  return order[dayNo()%order.length];
}
function roastsFor(id){
  const c=car(id); if(!c||!c.rounds) return [];
  const n=nm(id), all=Object.values(careers()).filter(x=>x.rounds>=3 && !P(x.id).guest);
  const out=[]; const add=(ok,s)=>{ if(ok) out.push(s); };
  const others=all.filter(x=>x.id!==id);
  const fieldAvg=others.length?others.reduce((a,x)=>a+x.avg,0)/others.length:0;
  const maxWins=Math.max(0,...all.map(x=>x.wins));
  add(c.tours>=2 && c.wins===0, `${c.tours} tours, no wins. Statistically ${n} is due. Statistically.`);
  add(c.wins>0 && c.wins===maxWins && all.filter(x=>x.wins===maxWins).length===1, `${c.wins} tour win${c.wins>1?"s":""}, more than anyone. You'll hear about it, mostly from ${n}.`);
  add(c.shared>0, `${c.shared===1?"One":c.shared} of those titles was shared. ${n} counts it as a full one.`);
  add(c.spoons>=2, `${c.spoons} wooden spoons. That isn't a record, it's a collection.`);
  add(c.spoons===1, `One wooden spoon on the CV. ${n} calls it “a transitional year”.`);
  add(c.spoons===0 && c.tours>=2, `Never had the spoon. Smug isn't a good look, but it's the only one ${n} has.`);
  add(c.second>=2, `Runner-up ${c.second} times. Always the bridesmaid, never the one buying the round.`);
  add(c.worst && c.worst.v<=20, `Career low: ${c.worst.v} points at ${c.worst.course}. The course still talks about it.`);
  add(c.best && c.best.v>=33, `${c.best.v} points at ${c.best.course}, once. ${n} has been dining out on it ever since.`);
  add(fieldAvg && c.avg<fieldAvg-1, `Averages ${f1(c.avg)} a round. Everybody else averages ${f1(fieldAvg)}. Maths can be cruel.`);
  add(fieldAvg && c.avg>fieldAvg+1, `Averages ${f1(c.avg)} a round against everybody else's ${f1(fieldAvg)}. Somebody check the handicap.`);
  add(c.rounds>=4, `Won ${c.rwins} of ${c.rounds} rounds. The other ${c.rounds-c.rwins} were “a learning experience”.`);
  add(c.recent.length>=4 && c.recentAvg>c.avg+1.5, `Last ${c.recent.length} rounds average ${f1(c.recentAvg)}, career ${f1(c.avg)}. Peaking, or a fluke. We'll see.`);
  add(c.recent.length>=4 && c.recentAvg<c.avg-1.5, `Last ${c.recent.length} rounds average ${f1(c.recentAvg)}, career ${f1(c.avg)}. Golf has noticed ${n}, and moved on.`);
  add(c.pw+c.pl+c.ph>=2 && c.pw===0, `Pairs record: played ${c.pw+c.pl+c.ph}, won none. Partners have started faking injuries.`);
  add(c.pw>=2 && c.pw>c.pl, `Pairs record ${c.pw}–${c.pl}${c.ph?"–"+c.ph:""}. Carried, or carrying? Ask the partners.`);
  add(c.ld>=2, `${c.ld} longest drives. Where they finished is a separate matter.`);
  add(c.ld===0 && c.rounds>=4, `Not one longest drive in ${c.rounds} rounds. Fairway finder, apparently. Allegedly.`);
  add(c.np>=2, `${c.np} nearest the pins. The putts that followed are not on record.`);
  add(c.moneyTours>=2 && c.money<0, `Career betting: ${money(c.money)}. A generous man. Nobody has ever asked him to be.`);
  add(c.moneyTours>=2 && c.money>0, `Career betting: ${money(c.money)}. The others call it luck. ${n} calls it a pension.`);
  add(c.hazR>=3 && c.haz/c.hazR>=9, `${f1(c.haz/c.hazR)} hazards a round. The kitty's favourite benefactor.`);
  others.forEach(o=>{
    const r=h2h(id,o.id), tot=r.w+r.l+r.h;
    if (tot>=4 && r.l>=r.w+2) out.push(`Lost ${r.l} of ${tot} rounds to ${nm(o.id)}. That isn't a rivalry, it's a subscription.`);
    if (tot>=4 && r.w>=r.l+2) out.push(`Beaten ${nm(o.id)} in ${r.w} of ${tot} rounds. ${nm(o.id)} has stopped bringing it up.`);
  });
  const lt=lastDone();
  if (lt){
    const W=winners(lt);
    if (W.includes(id)) out.push(`Holder of the title from ${tourLabel(lt)}. Enjoy it, because nobody else is.`);
    if (spoon(lt)===id) out.push(`Wooden spoon, ${tourLabel(lt)}. Polish it with pride.`);
  }
  return out;
}

function vH2H(){

    +ids.map(a=>`<tr><td class="nm">${esc(nm(a))}</td>`+ids.map(b=>{ if(a===b) return `<td class="x">—</td>`;

    +`</table></div><p class="note">Level rounds in brackets. Stableford points, every round both played.</p></div>`;
  // partnerships
  const pairs=[];
  for (let i=0;i<ids.length;i++) for (let j=i+1;j<ids.length;j++){ const r=h2h(ids[i],ids[j]); const n=r.with.w+r.with.l+r.with.h; if(n) pairs.push({a:ids[i],b:ids[j],...r.with,n}); }
  if (pairs.length){
    pairs.sort((x,y)=>(y.w+y.h/2)/y.n-(x.w+x.h/2)/x.n || y.n-x.n);
    h+=sec("Partnerships","Pairs matchplay, together")+`<div class="lb" style="max-width:520px">`+pairs.map((p,i)=>
      `<div class="row" style="cursor:default"><div class="c-pos">${i+1}</div><div class="c-name">${esc(nm(p.a))} &amp; ${esc(nm(p.b))}<span class="c-meta">played ${p.n}</span></div>
      <div class="c-tot" style="font-size:17px">${p.w}–${p.l}–${p.h}</div></div>`).join("")+`</div>`;
    const b=pairs[0], w=pairs[pairs.length-1];
    if (pairs.length>1 && b!==w) h+=`<div class="quip">${esc(`${nm(w.a)} and ${nm(w.b)}: ${w.w} win${w.w===1?"":"s"} from ${w.n} together. Some marriages aren't meant to be.`)}</div>`;
    h+=`</div>`;
  }

}
function vRecords(){
  const recs=[];
  let hi=null, lo=null, bestT=null, margin=null, close=null;
  for (const t of DOC.tours){
    (t.rounds||[]).forEach(r=>Object.entries(r.pts||{}).forEach(([id,v])=>{ if(!isNum(v)) return;
      if(!hi||v>hi.v) hi={v,id,t,r}; if(!lo||v<lo.v) lo={v,id,t,r}; }));
    if (!tourDone(t)) continue;
    const s=standing(t);
    s.forEach(r=>{ if(r.n>=2 && (!bestT||r.avg>bestT.avg)) bestT={...r,t}; });
    if (s.length>1){ const m=s[0].total-s[1].total;
      if(!margin||m>margin.m) margin={m,t,a:s[0].id,b:s[1].id};
      if(!close||m<close.m) close={m,t,a:s[0].id,b:s[1].id}; }
  }
  const C=Object.values(careers());
  const top=(f,min)=>C.filter(c=>c.rounds>=(min||1)).sort((a,b)=>f(b)-f(a))[0];
  if (hi) recs.push(["Best round", `${hi.v} points`, `${nm(hi.id)}, ${hi.r.course}, ${tourLabel(hi.t)}`]);
  if (lo) recs.push(["Worst round", `${lo.v} points`, `${nm(lo.id)}, ${lo.r.course}, ${tourLabel(lo.t)}`]);
  if (bestT) recs.push(["Best tour", `${f1(bestT.avg)} a round`, `${nm(bestT.id)}, ${tourLabel(bestT.t)} (${bestT.total} pts)`]);
  if (margin) recs.push(["Biggest win", `${margin.m} point${margin.m===1?"":"s"}`, `${nm(margin.a)} over ${nm(margin.b)}, ${tourLabel(margin.t)}`]);
  if (close) recs.push(["Closest finish", close.m?`${close.m} point${close.m===1?"":"s"}`:"Dead level", `${nm(close.a)} and ${nm(close.b)}, ${tourLabel(close.t)}`]);
  let x;
  if ((x=top(c=>c.avg,4))) recs.push(["Best average", `${f1(x.avg)} a round`, `${nm(x.id)}, ${x.rounds} rounds`]);
  if ((x=top(c=>c.rwins))&&x.rwins) recs.push(["Most rounds won", `${x.rwins}`, nm(x.id)]);
  if ((x=top(c=>c.ld))&&x.ld) recs.push(["Most longest drives", `${x.ld}`, nm(x.id)]);
  if ((x=top(c=>c.np))&&x.np) recs.push(["Most nearest the pins", `${x.np}`, nm(x.id)]);
  if ((x=top(c=>c.hazR?c.haz/c.hazR:0))&&x.hazR) recs.push(["Hazard magnet", `${f1(x.haz/x.hazR)} a round`, nm(x.id)]);
  let h=mast("The record book","Records","");
  h+=`<div class="sec"><div class="grid2">`+recs.map(([a,b,s])=>`<div class="card"><div class="card-h">${esc(a)}</div><div class="card-b">${esc(b)}</div><div class="card-s">${esc(s)}</div></div>`).join("")+`</div></div>`;
  if (lo) h+=`<div class="quip">${esc(`${lo.v} points at ${lo.r.course}. ${nm(lo.id)} has asked for this to be removed. Request denied.`)}</div>`;
  return h;
}

function vLedger(){

  const curs=new Set(DOC.tours.filter(t=>t.money).map(t=>t.currency||"£"));

  return h+`</div>`;
}

  pulling=true;
  const ctl=typeof AbortController==="function"?new AbortController():null;
  const stop=ctl?setTimeout(()=>ctl.abort(),8000):null;
  try{
    const r=await fetch("data.json?t="+Date.now(),{cache:"no-store",signal:ctl?ctl.signal:undefined});
    if(!r.ok) return false;
    const j=await r.json();
    if(!validPub(j)) return false;
    lastPull=Date.now();
    if (j.publishedAt && j.publishedAt===lastPublishedAt) return false;
    lsSet(K.saved, JSON.stringify(j));
    PUB=j; lastPublishedAt=j.publishedAt||String(Date.now());
    if (!READONLY){ const ed=lsGet(K.edit); if(!ed || (j.publishedAt && j.publishedAt>ed)) lsDel(K.ov); }
    rebuild(); _car=null; render(); paintBar(); toast("Scores updated");
    return true;
  }catch(e){ return false; }
  finally{ pulling=false; if(stop) clearTimeout(stop); }
}
function toast(msg){
  let t=document.getElementById("toast"); if(!t){ t=document.createElement("div"); t.id="toast"; document.body.appendChild(t); }
  t.textContent=msg; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),2400);
}

/* ---------- chrome + routing ---------- */
function paintBar(){
  const el=document.getElementById("wxbar"); if(!el) return;
  const up=upcoming(); const d=up?daysTo(up.start):null;
  el.innerHTML = up ? `<span class="bar-next">Next: ${esc(up.venue||up.name||"TBC")} · ${esc(fmtRange(up.start,up.end))}${d!=null&&d>0?` · ${d} day${d===1?"":"s"}`:""}</span>`
                    : `<span class="bar-next">Next tour: dates to be confirmed</span>`;
}
function render(){
  document.getElementById("tabbar").innerHTML = TABS.map(([k,l])=>`<button class="tab${k===curTab?" on":""}" onclick="go('${k}')">${l}</button>`).join("");
  const pills=document.getElementById("pills");
  pills.style.display = TOUR_TABS.includes(curTab) && DOC.tours.length ? "" : "none";
  pills.innerHTML = TOUR_TABS.includes(curTab) ? tourPills() : "";
  const v=document.getElementById("view");
  const views={home:vHome,tour:vTour,players:vPlayers,h2h:vH2H,records:vRecords,honours:vHonours,ledger:vLedger,enter:vEnter,setup:vSetup};
  try{ v.innerHTML=(views[curTab]||vHome)()+foot(); }
  catch(e){ v.innerHTML=`<div class="empty">Something went wrong drawing this page.</div>`; if(window.__err) window.__err(e); else console.error(e); }
  const on=document.querySelector(".tab.on"); if(on&&on.scrollIntoView) try{ on.scrollIntoView({inline:"center",block:"nearest"}); }catch(e){}
}
const foot = () => `<div class="foot">© ${new Date().getFullYear()} ${esc(CFG.organiser||"")} · ${esc(CFG.app_name)} · a private golf tour<br>${READONLY?"":"Keeper · "}build ${esc(BUILD)}</div>`;
window.go = k => { curTab=k; render(); window.scrollTo(0,0); };
window.setTour = (id, jump) => { curTour=id; if(jump) curTab="tour"; render(); if(jump) window.scrollTo(0,0); };
window.goPlayer = id => { curPlayer=id; curTab="players"; render(); window.scrollTo(0,0); };

/* ---------- the landing page ---------- */
const splashEl=document.getElementById("splash");
let splashArmed=false;
function buildSplash(){
  const up=upcoming(), lt=lastDone(), W=lt?winners(lt):[];
  const yr=up&&up.start?String(up.start).slice(0,4):String(new Date().getFullYear());
  const top=`<div class="sp-k">${esc(up?(up.venue||up.name||""):"")}</div>
    ${MONO}
    <div class="sp-t">${esc(CFG.app_name)}</div>
    <div class="sp-r"><span></span><em>${esc(yr)}</em><span></span></div>
    <div class="sp-v">${esc(up?fmtRange(up.start,up.end):"Next tour: dates TBC")}</div>`;
  const asking = READONLY && !meGet();
  if (asking){
    splashEl.innerHTML = top+`<div class="sp-who-h">Who are you?</div>
      <div class="sp-who-w">${core().map(p=>`<button class="sp-who-p" onclick="whoPick(event,'${p.id}')">${esc(nm(p.id))}</button>`).join("")}</div>
      <button class="sp-who-l" onclick="whoPick(event,'look')">Just looking</button>`;
    return;
  }
  const me=mePlayer();
  let hello="";
  if (me){ const q=roastOf(me,"splash");
    hello=`<div class="sp-me"><div class="sp-hi">Welcome back, ${esc(P(me).name)}</div>${q?`<div class="sp-qu">${esc(q)}</div>`:""}</div>`; }
  splashEl.innerHTML = top
    +(W.length?`<div class="sp-champ"><i>Champion${W.length>1?"s":""} · ${esc(tourLabel(lt))}</i><b>${W.map(id=>esc(nm(id))).join(" &amp; ")}</b></div>`:`<div class="sp-tag">${esc(CFG.tagline||"")}</div>`)
    +hello+`<div class="sp-e"><i>tap anywhere to go in</i></div>`
    +(READONLY?`<button class="sp-not" onclick="whoChange(event)">${me?"Not you?":"Playing after all?"}</button>`:"");
}
window.whoPick = (e,id) => { e.stopPropagation(); lsSet(K.me,id); buildSplash(); };
window.whoChange = e => { e.stopPropagation(); lsDel(K.me); buildSplash(); };
function showSplash(){ if(!splashEl) return; buildSplash(); splashEl.classList.remove("gone"); splashArmed=true; }
function leaveSplash(){
  if(!splashArmed||!splashEl) return;
  if (READONLY && !meGet()) return;
  splashArmed=false; splashEl.classList.add("gone");
  const me=mePlayer(); if (me && car(me)) { curPlayer=me; curTab="players"; render(); }
}
if (splashEl){
  splashEl.addEventListener("click", leaveSplash);
  document.addEventListener("keydown", ()=>{ if(splashArmed) leaveSplash(); });
}

render(); paintBar(); showSplash();
if (HOSTED){
  pullData();
  setInterval(()=>{ if(document.visibilityState==="visible") pullData(); }, 60000);
  document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible" && Date.now()-lastPull>30000) pullData(); });
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
}

</script>
